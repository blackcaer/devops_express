name: Build Express.js

on:
  push:
    branches:
      - ino_dev
  pull_request:
    branches:
      - ino_dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build --no-cache -f Dockerfile.build -t express-build .
      
      - name: Verify build
        run: |
          echo "Docker image built successfully!"
          docker images | grep express-build
      
      - name: Save Docker image as artifact
        run: docker save express-build -o express-build-image.tar
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: express-build-image
          path: express-build-image.tar
          retention-days: 7
